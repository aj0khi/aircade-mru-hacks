
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Arena</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Trebuchet MS", sans-serif;
            background: #111827;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            margin: 0 0 8px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 28px;
        }

        .arena {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            border: 2px solid #475569;
            border-radius: 8px;
            background: #e8edf2;
            box-shadow: 0 12px 35px rgba(0,0,0,0.4);
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            margin-top: 14px;
            font-size: 14px;
            font-weight: bold;
        }

        .player1 {
            color: #38bdf8;
        }

        .player2 {
            color: #fb7185;
        }

        .reset-button {
            margin-top: 20px;
            padding: 12px 28px;
            background: #334155;
            color: white;
            border: 1px solid #64748b;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .reset-button:hover {
            background: #475569;
        }

        .reset-button:focus-visible {
            outline: 3px solid #38bdf8;
            outline-offset: 3px;
        }

        .legend {
            margin: 16px 0 0;
            color: #94a3b8;
            font-size: 13px;
        }

        .swatch {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #a96523;
            border-radius: 2px;
            vertical-align: middle;
            margin-right: 5px;
        }

        .controls {
            max-width: 600px;
            margin: 24px auto 0;
            padding: 18px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
        }

        .controls h2 {
            margin: 0 0 14px;
            font-size: 18px;
        }

        .controls h3 {
            margin: 16px 0 10px;
            font-size: 14px;
        }

        .control-items {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            color: #cbd5e1;
            font-size: 14px;
        }

        kbd {
            display: inline-block;
            border: 1px solid #64748b;
            background: #334155;
            border-radius: 5px;
            padding: 5px 9px;
            color: white;
        }

        .alert-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: 10;
        }

        .alert-box-visible .alert-box {
            opacity: 1;
        }

        .alert-box-content {
            padding: 12px 24px;
            background: white;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 5px 20px #0005;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>TANK ARENA</h1>
        <p class="subtitle">Two tanks. One battlefield.</p>

        <div class="arena">

            <canvas
                id="gameCanvas"
                width="600"
                height="400">
            </canvas>

            <div class="player-info">
                <span class="player1">● PLAYER 1</span>
                <span class="player2">PLAYER 2 ●</span>
            </div>

        </div>

        <!-- RESET BUTTON -->
        <button
            class="reset-button"
            type="button"
            onclick="window.location.reload()">
            ↻ Reset Match
        </button>

        <!-- WALL LEGEND -->
        <p class="legend">
            <span class="swatch"></span>
            Bronze walls break after 3 hits.
            Dark walls are permanent.
        </p>

        <!-- CONTROLS -->
        <section class="controls">

            <h2>PLAYER CONTROLS</h2>

            <h3 class="player1">PLAYER 1 — BLUE</h3>

            <div class="control-items">
                <span>
                    <kbd>↑</kbd> <kbd>↓</kbd> Move
                </span>

                <span>
                    <kbd>←</kbd> <kbd>→</kbd> Rotate
                </span>

                <span>
                    <kbd>SPACE</kbd> Shoot
                </span>
            </div>

            <h3 class="player2">PLAYER 2 — RED</h3>

            <div class="control-items">
                <span>
                    <kbd>W</kbd> <kbd>S</kbd> Move
                </span>

                <span>
                    <kbd>A</kbd> <kbd>D</kbd> Rotate
                </span>

                <span>
                    <kbd>F</kbd> Shoot
                </span>
            </div>

        </section>

    </main>

    <div class="alert-box">
        <div
            class="alert-box-content"
            id="alertBoxContent">
        </div>
    </div>

    <!-- EXISTING GAME FILES -->
    <script src="collision.js"></script>
    <script src="game.js"></script>

    <!-- BREAKABLE WALL LOGIC -->
    <script>
        // Add the maze if game.js doesn't already contain it.
        const mazeWalls = [
            {x:170,y:85,w:8,h:90},
            {x:215,y:130,w:90,h:8},
            {x:300,y:75,w:8,h:80},
            {x:385,y:130,w:90,h:8},
            {x:430,y:85,w:8,h:90},

            {x:135,y:215,w:8,h:105},
            {x:180,y:245,w:90,h:8},
            {x:300,y:200,w:100,h:8},
            {x:465,y:215,w:8,h:105},
            {x:420,y:245,w:90,h:8},

            {x:185,y:345,w:8,h:65},
            {x:230,y:315,w:90,h:8},
            {x:415,y:345,w:8,h:65},
            {x:370,y:315,w:90,h:8}
        ];

        if (!obstacles.some(o =>
            o.x === 170 && o.y === 85 &&
            o.w === 8 && o.h === 90
        )) {
            obstacles.push(...mazeWalls);
        }

        // Choose five maze walls to make destructible.
        const breakablePositions = new Set([
            "215,130",
            "385,130",
            "180,245",
            "300,200",
            "420,245"
        ]);

        obstacles.forEach(wall => {
            if (breakablePositions.has(
                wall.x + "," + wall.y
            )) {
                wall.breakable = true;
                wall.hp = 3;
            }
        });

        // Give breakable walls their own appearance.
        drawObstacle = function(o) {
            c.beginPath();
            c.rect(
                o.x - o.w / 2,
                o.y - o.h / 2,
                o.w,
                o.h
            );

            if (o.breakable) {
                c.fillStyle =
                    o.hp === 3 ? "#a96523" :
                    o.hp === 2 ? "#c48b3b" :
                    "#e6bd78";
            } else {
                c.fillStyle = "#333";
            }

            c.fill();
        };

        // Handle tanks and bullets hitting walls.
        serveObstacles = function() {
            var tanks = [tank, secondTank];

            // Reverse order allows destroyed walls to
            // be removed safely.
            for (var i = obstacles.length - 1; i >= 0; i--) {
                var wall = obstacles[i];
                var oPoly = getObstaclePolygon(wall);

                // Stop both tanks from crossing walls.
                for (var p = 0; p < tanks.length; p++) {
                    var currentTank = tanks[p];

                    if (currentTank.destroyed) continue;

                    var skPoly =
                        getTankSkeletonPolygon(currentTank);

                    var collision =
                        Collision.polygonToPolygon(
                            oPoly, skPoly
                        );

                    if (collision !== null) {
                        currentTank.x += collision.separation.x;
                        currentTank.y += collision.separation.y;

                        currentTank.turret.x = currentTank.x;
                        currentTank.turret.y = currentTank.y;
                    }
                }

                var destroyed = false;

                // Check bullets against this wall.
                for (var j = bullets.length - 1; j >= 0; j--) {
                    var b = bullets[j];

                    var hit = Collision.circleToPolygon(
                        {x:b.x, y:b.y, r:bullet.r},
                        oPoly
                    );

                    if (hit === null) continue;

                    if (wall.breakable) {
                        // Bullet damages wall and disappears.
                        wall.hp--;
                        bullets.splice(j, 1);

                        if (wall.hp <= 0) {
                            obstacles.splice(i, 1);
                            destroyed = true;
                            break;
                        }
                    } else {
                        // Permanent walls reflect bullets.
                        var axis =
                            Math.abs(hit.vector.x) >
                            Math.abs(hit.vector.y)
                            ? "x" : "y";

                        if (axis === "x") {
                            b.pitch = Math.PI - b.pitch;
                        } else {
                            b.pitch = -b.pitch;
                        }
                    }
                }

                if (!destroyed) {
                    drawObstacle(wall);
                }
            }
        };
    </script>

</body>
</html>
