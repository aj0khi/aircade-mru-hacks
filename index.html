<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HeadPilot Arcade</title>
  </head>
  <body>
    <main class="arcade">
      <header class="header">
        <div class="brand">
          <p class="eyebrow">HEADPILOT / ARCADE 01</p>
          <h1 id="game-title">SOCCER PONG</h1>
          <p id="game-subtitle" class="subtitle">A quick match. First to seven.</p>
        </div>
        <div class="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="mode-label">1P // VS AI</span>
        </div>
      </header>

      <section class="game-shell" aria-label="Soccer Pong game">
        <div class="scoreboard" aria-live="polite">
          <span id="player-score">0</span>
          <span id="score-divider" class="score-divider">:</span>
          <span id="opponent-score">0</span>
        </div>
        <canvas id="game-canvas" width="960" height="540" aria-label="Horizontal soccer pitch"></canvas>
        <div id="message" class="message">PRESS START</div>
      </section>

      <section class="controls" aria-label="Game controls">
        <div class="control-group primary-actions">
          <button id="start-button" class="primary" type="button">START GAME</button>
          <button id="pause-button" type="button">PAUSE</button>
          <button id="restart-button" type="button">RESTART</button>
        </div>
        <div class="control-group mode-actions">
          <button id="mode-button" type="button">2P MODE</button>
          <button id="game-button" type="button">SNAKE</button>
        </div>
      </section>

      <p id="instructions" class="instructions">
        <span><strong>Player 1</strong> W / S</span>
        <span aria-hidden="true">·</span>
        <span><strong>Player 2</strong> ↑ / ↓</span>
        <span aria-hidden="true">·</span>
        P / Esc pauses
        <span aria-hidden="true">·</span>
        First to 7 wins
      </p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
