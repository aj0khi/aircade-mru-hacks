<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Bowling</title>
		<meta charset="utf-8"/>
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"/>
		<style>
			:root {
				color-scheme: dark;
				font-family: Inter, ui-sans-serif, system-ui, sans-serif;
			}

			body {
				margin: 0px;
				overflow: hidden;
				background: #0c100d;
			}

			#container {
				position: relative;
				width: 100vw;
				height: 100vh;
				overflow: hidden;
			}

			#container canvas {
				display: block;
			}

			.headpilot-hud {
				position: fixed;
				inset: 18px 22px auto;
				display: flex;
				align-items: flex-start;
				justify-content: space-between;
				pointer-events: none;
				text-transform: uppercase;
				letter-spacing: 0.12em;
			}

			.headpilot-brand,
			.headpilot-status {
				padding: 9px 12px;
				border: 1px solid rgba(204, 231, 207, 0.2);
				border-radius: 999px;
				background: rgba(12, 16, 13, 0.72);
				font-size: 10px;
				font-weight: 800;
			}

			.headpilot-brand {
				color: #cce7cf;
			}

			.headpilot-status {
				color: #78e4d1;
			}

			.headpilot-hint {
				position: fixed;
				inset: auto 0 18px;
				color: rgba(244, 247, 242, 0.72);
				font-size: 11px;
				font-weight: 700;
				text-align: center;
				letter-spacing: 0.08em;
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<div id="container">
			<div class="headpilot-hud">
				<div class="headpilot-brand">HEADPILOT / LANE 01</div>
				<div id="headpilot-status" class="headpilot-status">READY</div>
			</div>
			<div class="headpilot-hint">DRAG TO AIM &nbsp; · &nbsp; FLICK FORWARD TO ROLL</div>
		</div>

		<script src="js/ammo.js"></script>
		<script src="js/three.js"></script>
		<script src="js/GLTFLoader.js"></script>
		<script src="js/scores.js"></script>
		<script src="js/bowlphysics.js"></script>
		<script src="js/bowlchallenge.js"></script>
	</body>
</html>
